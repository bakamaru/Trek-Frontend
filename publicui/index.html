<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Poppins"', 'sans-serif'],
            heading: ['"Michroma"', 'sans-serif'],
          },
          colors: {
            // Override blue to match logo brand color #008cff
            blue: {
              50:  '#e6f4ff',
              100: '#cce9ff',
              200: '#99d3ff',
              300: '#66bdff',
              400: '#33a7ff',
              500: '#008cff',
              600: '#0070cc',
              700: '#008cff',
              800: '#0060b3',
              900: '#004080',
              950: '#002040',
            },
          },

        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Michroma&display=swap" rel="stylesheet">
  <script>
    // Default to light mode. Only enable dark mode if explicitly saved in localStorage.
    if (localStorage.theme === 'dark') {
      document.documentElement.classList.add('dark')
    } else {
      document.documentElement.classList.remove('dark')
    }
  </script>

</head>

<body class="dark:bg-gray-900">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
